name: Codex CLI
binary: codex
discovery:
  command: "codex --help"
  parse_strategy: regex
  pattern: "-m, --model <MODEL>"
  notes: "Codex CLI accepts model names via -m/--model. Supports OpenAI models (o3, o4-mini, gpt-4.1) and local models via --oss flag. No list-models subcommand."
invocation:
  template: "codex exec --model {model} \"{prompt}\""
  flags:
    full_auto: "--full-auto"
    sandbox: "--sandbox {value}"
    approval: "--ask-for-approval {value}"
    dangerously_bypass: "--dangerously-bypass-approvals-and-sandbox"
    search: "--search"
