artifactClasses:
  task:
    canonicalSource: convex
    exportTarget: 'measure/tracks/*/plan.md'
    importAllowed:
      - status
      - priority
      - assignee
    conflictStrategy: prefer_canonical

  trackMetadata:
    canonicalSource: convex
    exportTarget: 'measure/tracks.md'
    importAllowed: []
    conflictStrategy: manual

  issue:
    canonicalSource: markdown
    exportTarget: null
    importAllowed:
      - title
      - description
      - labels
    conflictStrategy: prefer_export

  plan:
    canonicalSource: markdown
    exportTarget: 'measure/tracks/*/plan.md'
    importAllowed: []
    conflictStrategy: reject