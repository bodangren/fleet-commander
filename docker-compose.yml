services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: convex_local
      POSTGRES_DB: convex_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convex"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
