name: Opencode
binary: opencode
discovery:
  command: "opencode models"
  parse_strategy: line-per-model
  pattern: ""
  notes: "opencode models [provider] lists available models. Optional provider filter (for example opencode models anthropic). Output is one model per line in provider/model format."
invocation:
  template: "opencode -m {model} run \"{prompt}\""
  flags:
    agent: "--agent {value}"
    continue: "--continue"
    session: "--session {value}"
    prompt: "--prompt \"{value}\""
