name: Gemini CLI
binary: gemini
discovery:
  command: "gemini --help"
  parse_strategy: regex
  pattern: "-m, --model\\s+Model\\s+\\[string\\]"
  notes: "Gemini CLI accepts model names via -m/--model (e.g. gemini-2.5-pro, gemini-2.5-flash). No list-models subcommand; models are documented at cloud.google.com/vertex-ai/docs."
invocation:
  template: "gemini --model {model} --prompt \"{prompt}\""
  flags:
    yolo: "--yolo"
    approval_mode: "--approval-mode {value}"
    sandbox: "--sandbox"
    output_format: "--output-format {value}"
